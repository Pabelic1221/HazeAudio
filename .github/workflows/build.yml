# Builds the Windows app in the cloud - no Python needed on your own PC.
# GitHub > Actions > "Build Windows app" > Run workflow, then download the artifact.
name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --windowed --name HazeAudio --icon icon.ico --add-data "icon.ico;." haze_audio.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: HazeAudio-Windows
          path: |
            installer/*.exe
            dist/HazeAudio
